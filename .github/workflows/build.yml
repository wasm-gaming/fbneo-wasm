name: Build

# Builds the two halves of the package and, on main, deploys the demo to Pages.
# release.yml builds again from the bumped version and publishes.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck and test (the built package, loaded with no import map)
        run: make test
      - run: make demo
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-dist
          path: dist/

  wasm:
    runs-on: ubuntu-latest
    container:
      image: emscripten/emsdk:6.0.2   # pinned, same as scripts/build-fbneo-docker.sh
    steps:
      - uses: actions/checkout@v4
      - name: Build FBNeo (pinned upstream commit)
        run: |
          apt-get update -qq && apt-get install -y -qq git make perl
          make build-wasm-ci
      - uses: actions/upload-artifact@v4
        with:
          name: wasm-dist
          path: dist/fbneo/fbneo.*

  pages:
    needs: [sdk, wasm]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with: { name: sdk-dist, path: dist }
      - uses: actions/download-artifact@v4
        with: { name: wasm-dist, path: dist/fbneo }
      - uses: actions/configure-pages@v5
        with: { enablement: true }
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
      - id: deploy
        uses: actions/deploy-pages@v4
