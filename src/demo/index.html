<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FBNeo WASM</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    html, body { margin: 0; height: 100%; background: #000; color: #e2e8f0; }
    body { display: grid; grid-template-rows: 1fr auto; }
    #stage { display: grid; place-items: center; min-height: 0; }
    #bar { display: flex; gap: .75rem; align-items: center; justify-content: center; padding: .75rem; background: #111; flex-wrap: wrap; }
    button, label { font: inherit; padding: .4rem 1rem; background: #222; color: inherit; border: 1px solid #444; border-radius: 6px; cursor: pointer; }
    #status { color: #94a3b8; font-size: .85rem; }
    #drop { position: fixed; inset: 0; display: none; place-items: center; background: #000c; font-size: 1.4rem; }
    body.dragging #drop { display: grid; }
    input[type=file] { display: none; }
  </style>
</head>
<body>
  <div id="stage"></div>
  <div id="bar">
    <label>ROM set <input type="file" id="rom" accept=".zip,.7z,.neo" /></label>
    <label>BIOS (neogeo.zip) <input type="file" id="bios" accept=".zip" /></label>
    <button id="pause" disabled>Pause</button>
    <button id="reset" disabled>Reset</button>
    <button id="save" disabled>Save state</button>
    <button id="load" disabled>Load state</button>
    <span id="status">Pick a BIOS if the game needs one, then a ROM set (zip named after its driver, or a .neo).</span>
  </div>
  <div id="drop">Drop the ROM set</div>

  <script type="module">
    // No build and no import map: the SDK is self-contained (it carries the
    // contract's runtime beside it). One game per page — reload for another.
    import FbneoSDK from './fbneo/fbneo.sdk.js';
    import { RomsetIndex, resolveDriver } from './fbneo/romset.js';
    import { isNeoFile, neoToRomset } from './fbneo/neo.js';

    const status = document.querySelector('#status');
    let play = null;
    let bios = null;

    // The driver: a picked file may be named `mslug (1).zip`, but FBNeo needs `mslug`.
    // The Neo Geo dataset recovers it from the CRC-32s inside the zip (the `romset`
    // export), and rebuilds a `.neo` flash-cart image into a ROM set (the `neo` export).
    let dataset = null;
    const getDataset = () =>
      (dataset ??= fetch('./fbneo/romsets/neogeo.json')
        .then((r) => r.json())
        .then((system) => ({ system, index: new RomsetIndex([system]) })));

    async function identify(file) {
      const bytes = new Uint8Array(await file.arrayBuffer());
      try {
        const { system, index } = await getDataset();
        if (isNeoFile(bytes)) {
          const { driver, zip, chips, info } = neoToRomset(bytes, system);
          console.log(`[fbneo demo] rebuilt .neo "${info.name}" as ${driver} (${chips.length} chips)`);
          return { rom: zip, driver };
        }
        const match = resolveDriver(bytes, index);
        if (match) {
          console.log(`[fbneo demo] identified by content: ${match.driver} (${match.matched}/${match.total} ROMs)`);
          return { rom: bytes, driver: match.driver };
        }
      } catch (error) {
        if (isNeoFile(bytes)) throw error; // a raw .neo can never boot
        console.warn('[fbneo demo] content identification skipped:', error);
      }
      return { rom: bytes, driver: '' };
    }

    async function boot(file) {
      if (play) { location.reload(); return; }
      status.textContent = `Loading ${file.name}…`;
      try {
        const { rom, driver } = await identify(file);
        play = await new FbneoSDK()
          .options({ driver, romFileName: file.name })
          .assets({ rom, bios })
          .storage({ namespace: driver || file.name.replace(/\.[^.]+$/, '') })
          .on('saves', ({ detail }) => (status.textContent = `Saved ${detail.files.join(', ')} → ${play.storagePath}/`))
          .on('error', ({ detail }) => (status.textContent = `Error: ${detail.message}`))
          .mount(document.querySelector('#stage'))
          .start();
        status.textContent = `${play.driver} — saves in OPFS ${play.storagePath}/`;
        for (const b of document.querySelectorAll('button')) b.disabled = false;
        document.querySelector('#stage canvas').focus();
      } catch (e) {
        status.textContent = `Error: ${e.message}`;
      }
    }

    document.querySelector('#bios').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      bios = new Uint8Array(await file.arrayBuffer());
      status.textContent = `BIOS ${file.name} ready. Now the ROM set.`;
    });
    document.querySelector('#rom').addEventListener('change', (e) => e.target.files[0] && boot(e.target.files[0]));
    document.querySelector('#pause').addEventListener('click', (e) => {
      if (play.pausedBy) { play.resume('demo'); e.target.textContent = 'Pause'; }
      else { play.pause('demo'); e.target.textContent = 'Resume'; }
    });
    document.querySelector('#reset').addEventListener('click', () => play.restart());
    document.querySelector('#save').addEventListener('click', async () => {
      await play.states.save(0);
      status.textContent = 'State saved in slot 0.';
    });
    document.querySelector('#load').addEventListener('click', () => {
      status.textContent = play.states.load(0) ? 'State loaded.' : 'Slot 0 is empty.';
    });
    addEventListener('dragover', (e) => { e.preventDefault(); document.body.classList.add('dragging'); });
    addEventListener('dragleave', () => document.body.classList.remove('dragging'));
    addEventListener('drop', (e) => {
      e.preventDefault();
      document.body.classList.remove('dragging');
      const file = e.dataTransfer.files[0];
      if (file) boot(file);
    });
  </script>
</body>
</html>
